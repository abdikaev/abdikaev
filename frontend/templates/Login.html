<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F5F3FF">
  <title>EduPath — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Стили для страницы входа -->
  <style>
    /* Стили чекбокса */
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input {
      display: none;
    }

    .checkbox-container span {
      width: 20px;
      height: 20px;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .checkbox-container input:checked + span {
      background: var(--primary);
      border-color: var(--primary);
    }

    .checkbox-container svg {
      width: 16px;
      height: 16px;
      color: #fff;
      display: none;
    }

    .checkbox-container input:checked + span svg {
      display: block;
    }

    /* Нижняя часть формы */
    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .form-footer a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .form-footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Адаптивные стили */
    @media (max-width: 640px) {
      .form-footer {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- Логотип -->
  <header>
    <img src="img/Logo.svg" alt="EduPath">
  </header>

  <!-- Форма входа -->
  <main>
    <div>
      <h1>С возвращением!</h1>
      <p>Войдите в аккаунт на EduPath</p>
    </div>
    <form id="loginForm">
      <div>
        <label for="username">Имя пользователя</label>
        <input id="username" type="text" placeholder="Введите имя" required>
      </div>
      <div>
        <label for="password">Пароль</label>
        <div class="password-container">
          <input id="password" type="password" placeholder="Введите пароль" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Показать пароль">
            <img id="eyeIcon" src="img/Eye.svg" alt="Показать пароль" width="20" height="20">
          </button>
        </div>
      </div>
      <div class="form-footer">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </span>
          Запомнить меня
        </label>
        <a href="#">Забыли пароль?</a>
      </div>
      <button type="submit">Войти</button>
      <p class="register-link">
        Нет аккаунта? <a href="#">Регистрация</a>
      </p>
    </form>
  </main>

  <!-- Логика страницы входа -->
  <script src="js/scripts.js"></script>
  <script>
    // Имитация бэкенда для тестирования
    const mockBackend = {
      async login(username, password) {
        await new Promise(resolve => setTimeout(resolve, 500));
        if (username && password) {
          return { success: true, message: `Добро пожаловать, ${username}!` };
        }
        return { success: false, message: 'Пожалуйста, заполните все поля' };
      }
    };

    // Сервис авторизации
    const authService = {
      async login(username, password, remember) {
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, remember })
          });
          if (!response.ok) throw new Error('Ошибка сервера');
          return await response.json();
        } catch (error) {
          console.warn('Бэкенд недоступен, используется мок:', error);
          return await mockBackend.login(username, password);
        }
      }
    };

    // Инициализация переключателя пароля
    setupPasswordToggle('togglePassword', 'password', 'eyeIcon');

    // Обработка отправки формы
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      const loginResult = await authService.login(username, password, remember);
      alert(loginResult.message);
    });

    // Обработка изменения чекбокса
    document.getElementById('rememberMe').addEventListener('change', function () {
      const checkboxIcon = document.querySelector('.checkbox-container svg');
      checkboxIcon.style.display = this.checked ? 'block' : 'none';
    });
  </script>
</body>
</html>
