<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F5F3FF">
  <title>EduPath — Регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Логотип -->
  <header>
    <img src="img/Logo.svg" alt="EduPath">
  </header>

  <!-- Форма регистрации -->
  <main>
    <div>
      <h1>Добро пожаловать!</h1>
      <p>Создайте аккаунт на EduPath</p>
    </div>
    <form id="registerForm">
      <div>
        <label for="username">Имя пользователя</label>
        <input id="username" type="text" placeholder="Введите имя" required>
      </div>
      <div>
        <label for="email">Электронная почта</label>
        <input id="email" type="email" placeholder="Введите email" required>
      </div>
      <div>
        <label for="password">Пароль</label>
        <div class="password-container">
          <input id="password" type="password" placeholder="Введите пароль" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Показать пароль">
            <img id="eyeIcon" src="img/Eye.svg" alt="Показать пароль" width="20" heightFav="20">
          </button>
        </div>
      </div>
      <div>
        <label for="confirmPassword">Подтвердите пароль</label>
        <div class="password-container">
          <input id="confirmPassword" type="password" placeholder="Повторите пароль" required>
          <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Показать пароль">
            <img id="eyeIconConfirm" src="img/Eye.svg" alt="Показать пароль" width="20" height="20">
          </button>
        </div>
      </div>
      <button type="submit">Зарегистрироваться</button>
      <p class="register-link">
        Уже есть аккаунт? <a href="#">Войти</a>
      </p>
    </form>
  </main>

  <!-- Логика страницы регистрации -->
  <script src="js/scripts.js"></script>
  <script>
    // Имитация бэкенда для тестирования
    const mockBackend = {
      async register(username, email, password, confirmPassword) {
        await new Promise(resolve => setTimeout(resolve, 500));
        if (!username || !email || !password || !confirmPassword) {
          return { success: false, message: 'Пожалуйста, заполните все поля' };
        }
        if (password !== confirmPassword) {
          return { success: false, message: 'Пароли не совпадают' };
        }
        return { success: true, message: `Регистрация успешна, ${username}!` };
      }
    };

    // Сервис регистрации
    const authService = {
      async register(username, email, password, confirmPassword) {
        try {
          const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, confirmPassword })
          });
          if (!response.ok) throw new Error('Ошибка сервера');
          return await response.json();
        } catch (error) {
          console.warn('Бэкенд недоступен, используется мок:', error);
          return await mockBackend.register(username, email, password, confirmPassword);
        }
      }
    };

    // Инициализация переключателей пароля
    setupPasswordToggle('togglePassword', 'password', 'eyeIcon');
    setupPasswordToggle('toggleConfirmPassword', 'confirmPassword', 'eyeIconConfirm');

    // Обработка отправки формы
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const registerResult = await authService.register(username, email, password, confirmPassword);
      alert(registerResult.message);
    });
  </script>
</body>
</html>
