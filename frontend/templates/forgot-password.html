<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F5F3FF">
  <title>EduPath — Сброс пароля</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Логотип -->
  <header>
    <img src="img/Logo.svg" alt="EduPath">
  </header>

  <!-- Форма сброса пароля -->
  <main>
    <div>
      <h1>Сброс пароля</h1>
      <p>Введите email для восстановления доступа</p>
    </div>
    <form id="forgotPasswordForm">
      <div>
        <label for="email">Электронная почта</label>
        <input id="email" type="email" placeholder="Введите email" required>
      </div>
      <button type="submit">Отправить</button>
      <p class="register-link">
        Вспомнили пароль? <a href="#">Войти</a>
      </p>
    </form>
  </быть>
  <!-- Логика страницы сброса пароля -->
  <script>
    // Имитация бэкенда для тестирования
    const mockBackend = {
      async resetPassword(email) {
        await new Promise(resolve => setTimeout(resolve, 500));
        if (!email) {
          return { success: false, message: 'Пожалуйста, введите email' };
        }
        return { success: true, message: `Инструкции по сбросу пароля отправлены на ${email}` };
      }
    };

    // Сервис сброса пароля
    const authService = {
      async resetPassword(email) {
        try {
          const response = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          if (!response.ok) throw new Error('Ошибка сервера');
          return await response.json();
        } catch (error) {
          console.warn('Бэкенд недоступен, используется мок:', error);
          return await mockBackend.resetPassword(email);
        }
      }
    };

    // Обработка отправки формы
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      const resetPasswordResult = await authService.resetPassword(email);
      alert(resetPasswordResult.message);
    });
  </script>
</body>
</html>
